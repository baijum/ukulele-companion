name: Claude Code

# Deliberately @claude-mention-only (see the `if:` gate below). Automatic, every-PR
# AI review is already handled by CodeRabbit (.coderabbit.yaml) — do NOT add a
# path-triggered auto-review here, as it would duplicate that and add cost/noise.
# This workflow is for on-demand help when a human explicitly asks Claude.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@baa00e1092c6252b7f9eeb21364a432779460b17 # v1.0.144
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
