name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Prepare iOS Simulator
        run: |
          for i in $(seq 1 5); do
            if xcrun simctl list runtimes | grep -q "com.apple.CoreSimulator.SimRuntime.iOS"; then
              break
            fi
            echo "Waiting for iOS simulator runtime (attempt $i/5)..."
            sleep 10
          done

          xcrun simctl list runtimes

          RUNTIME=$(xcrun simctl list runtimes | grep "^iOS" | tail -1 | awk '{print $NF}')
          if [ -z "$RUNTIME" ]; then
            echo "::error::No iOS simulator runtime found"
            exit 1
          fi
          echo "Runtime: $RUNTIME"

          if ! xcrun simctl list devices available | grep -q "iPhone 16"; then
            echo "Creating iPhone 16 simulator..."
            xcrun simctl create "iPhone 16" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16" \
              "$RUNTIME"
          fi

          xcrun simctl list devices available | grep "iPhone"

      - name: Build shared framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Download ONNX Runtime
        run: bash iosApp/setup_onnxruntime.sh

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project iosApp/UkuleleCompanion.xcodeproj \
            -scheme UkuleleCompanion \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS tests
        run: |
          xcodebuild test \
            -project iosApp/UkuleleCompanion.xcodeproj \
            -scheme UkuleleCompanion \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: TestResults.xcresult
