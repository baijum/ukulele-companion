name: ktlint

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.kt'
      - '.editorconfig'
      - 'ktlint-baseline.xml'
      - 'scripts/ktlint.sh'
      - '.github/workflows/ktlint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.kt'
      - '.editorconfig'
      - 'ktlint-baseline.xml'
      - 'scripts/ktlint.sh'
      - '.github/workflows/ktlint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    # Baseline-aware: fails only on violations introduced beyond ktlint-baseline.xml.
    name: ktlint (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache ktlint binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ktlint
          key: ktlint-1.8.0

      - name: Run ktlint (new violations only)
        run: scripts/ktlint.sh --baseline=ktlint-baseline.xml
