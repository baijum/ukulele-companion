name: ktlint

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.kt'
      - '.editorconfig'
      - 'ktlint-baseline.xml'
      - 'scripts/ktlint.sh'
      - '.github/workflows/ktlint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.kt'
      - '.editorconfig'
      - 'ktlint-baseline.xml'
      - 'scripts/ktlint.sh'
      - '.github/workflows/ktlint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    # Baseline-aware: fails only on violations introduced beyond ktlint-baseline.xml.
    name: ktlint (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache ktlint binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ktlint
          key: ktlint-1.8.0

      - name: Run ktlint (new violations only)
        run: scripts/ktlint.sh --baseline=ktlint-baseline.xml
