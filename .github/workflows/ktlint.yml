name: ktlint

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.kt'
      - '.editorconfig'
      - 'ktlint-baseline.xml'
      - 'scripts/ktlint.sh'
      - '.github/workflows/ktlint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.kt'
      - '.editorconfig'
      - 'ktlint-baseline.xml'
      - 'scripts/ktlint.sh'
      - '.github/workflows/ktlint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    # Baseline-aware: fails only on violations introduced beyond ktlint-baseline.xml.
    name: ktlint (ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache ktlint binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ktlint
          key: ktlint-1.8.0

      - name: Run ktlint (new violations only)
        run: scripts/ktlint.sh --baseline=ktlint-baseline.xml
