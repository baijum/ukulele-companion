name: iOS Stress Tests

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  stress-tests:
    name: Stress Tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Prepare iOS Simulator
        run: |
          for i in $(seq 1 5); do
            if xcrun simctl list runtimes | grep -q "com.apple.CoreSimulator.SimRuntime.iOS"; then
              break
            fi
            echo "Waiting for iOS simulator runtime (attempt $i/5)..."
            sleep 10
          done

          xcrun simctl list runtimes

          RUNTIME=$(xcrun simctl list runtimes | grep "^iOS" | tail -1 | awk '{print $NF}')
          if [ -z "$RUNTIME" ]; then
            echo "::error::No iOS simulator runtime found"
            exit 1
          fi
          echo "Runtime: $RUNTIME"

          if ! xcrun simctl list devices available | grep -q "iPhone 16"; then
            echo "Creating iPhone 16 simulator..."
            xcrun simctl create "iPhone 16" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16" \
              "$RUNTIME"
          fi

          xcrun simctl list devices available | grep "iPhone"

      - name: Build shared framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Download ONNX Runtime
        run: bash iosApp/setup_onnxruntime.sh

      - name: Run stress tests
        env:
          RUN_STRESS_TESTS: "1"
        run: |
          xcodebuild test \
            -project iosApp/UkuleleCompanion.xcodeproj \
            -scheme UkuleleCompanion \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:UkuleleCompanionUITests \
            -resultBundlePath StressTestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-stress-test-results
          path: StressTestResults.xcresult
