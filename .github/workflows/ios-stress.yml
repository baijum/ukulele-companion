name: iOS Stress Tests

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

env:
  XCODE_VERSION: '16.4'

permissions:
  contents: read

jobs:
  stress-tests:
    name: Stress Tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Prepare iOS Simulator
        run: |
          set -e
          for i in $(seq 1 5); do
            if xcrun simctl list runtimes | grep -q "com.apple.CoreSimulator.SimRuntime.iOS"; then
              break
            fi
            echo "Waiting for iOS simulator runtime (attempt $i/5)..."
            sleep 10
          done

          xcrun simctl list runtimes

          RUNTIME=$(xcrun simctl list runtimes | grep "^iOS" | tail -1 | awk '{print $NF}')
          if [ -z "$RUNTIME" ]; then
            echo "::error::No iOS simulator runtime found"
            exit 1
          fi
          echo "Runtime: $RUNTIME"

          if ! xcrun simctl list devices available | grep -q "iPhone 16"; then
            echo "Creating iPhone 16 simulator..."
            xcrun simctl create "iPhone 16" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16" \
              "$RUNTIME"
          fi

          # Find UDID for the last (latest-runtime) available iPhone 16
          SIM_UDID=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          # Devices are grouped by runtime; pick the latest runtime's iPhone 16
          udid = None
          for runtime in sorted(data['devices'].keys()):
              for dev in data['devices'][runtime]:
                  if dev['name'] == 'iPhone 16' and dev['isAvailable']:
                      udid = dev['udid']
          print(udid or '')
          ")
          if [ -z "$SIM_UDID" ]; then
            echo "::error::Could not find iPhone 16 simulator UDID"
            exit 1
          fi
          echo "Booting simulator $SIM_UDID ..."
          xcrun simctl boot "$SIM_UDID" || true
          # Wait for the simulator to finish booting
          xcrun simctl bootstatus "$SIM_UDID" -b
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"

          xcrun simctl list devices available | grep "iPhone"

      - name: Build shared framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Download ONNX Runtime
        run: bash iosApp/setup_onnxruntime.sh

      - name: Run stress tests
        env:
          RUN_STRESS_TESTS: "1"
        run: |
          xcodebuild test \
            -project iosApp/UkuleleCompanion.xcodeproj \
            -scheme UkuleleCompanion \
            -destination "id=$SIM_UDID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:UkuleleCompanionUITests \
            -resultBundlePath StressTestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-stress-test-results
          path: StressTestResults.xcresult

      - name: Upload crash logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-crash-logs
          path: ~/Library/Logs/DiagnosticReports/UkuleleCompanion*

  tsan-tests:
    name: Thread Sanitizer
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Prepare iOS Simulator
        run: |
          set -e
          for i in $(seq 1 5); do
            if xcrun simctl list runtimes | grep -q "com.apple.CoreSimulator.SimRuntime.iOS"; then
              break
            fi
            echo "Waiting for iOS simulator runtime (attempt $i/5)..."
            sleep 10
          done

          xcrun simctl list runtimes

          RUNTIME=$(xcrun simctl list runtimes | grep "^iOS" | tail -1 | awk '{print $NF}')
          if [ -z "$RUNTIME" ]; then
            echo "::error::No iOS simulator runtime found"
            exit 1
          fi
          echo "Runtime: $RUNTIME"

          if ! xcrun simctl list devices available | grep -q "iPhone 16"; then
            echo "Creating iPhone 16 simulator..."
            xcrun simctl create "iPhone 16" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16" \
              "$RUNTIME"
          fi

          # Find UDID for the last (latest-runtime) available iPhone 16
          SIM_UDID=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          # Devices are grouped by runtime; pick the latest runtime's iPhone 16
          udid = None
          for runtime in sorted(data['devices'].keys()):
              for dev in data['devices'][runtime]:
                  if dev['name'] == 'iPhone 16' and dev['isAvailable']:
                      udid = dev['udid']
          print(udid or '')
          ")
          if [ -z "$SIM_UDID" ]; then
            echo "::error::Could not find iPhone 16 simulator UDID"
            exit 1
          fi
          echo "Booting simulator $SIM_UDID ..."
          xcrun simctl boot "$SIM_UDID" || true
          # Wait for the simulator to finish booting
          xcrun simctl bootstatus "$SIM_UDID" -b
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"

          xcrun simctl list devices available | grep "iPhone"

      - name: Build shared framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Download ONNX Runtime
        run: bash iosApp/setup_onnxruntime.sh

      - name: Run tests with Thread Sanitizer
        env:
          RUN_STRESS_TESTS: "1"
        run: |
          xcodebuild test \
            -project iosApp/UkuleleCompanion.xcodeproj \
            -scheme UkuleleCompanion \
            -destination "id=$SIM_UDID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -enableThreadSanitizer YES \
            -only-testing:UkuleleCompanionUITests \
            -resultBundlePath TSanResults

      - name: Upload TSan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tsan-results
          path: TSanResults.xcresult

      - name: Upload TSan crash logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-tsan-crash-logs
          path: ~/Library/Logs/DiagnosticReports/UkuleleCompanion*
