name: Fuzz Tests

on:
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Max fuzz duration per target (seconds)'
        required: false
        default: '60'

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@cf4beec8b4cca436a7b646657f74edc125658df8 # v6.1.1

      - name: Restore fuzz corpus cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: app/src/test/resources/corpus
          key: fuzz-corpus-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-

      - name: Run fuzz tests
        env:
          JAZZER_FUZZ: 1
        run: >
          ./gradlew :app:testDebugUnitTest --tests "com.baijum.ukufretboard.fuzz.*"
          -Djazzer.instrumentation_includes="com.baijum.ukufretboard.**"
          -Djazzer.max_duration="${{ github.event.inputs.duration_seconds || '60' }}s"

      - name: Save fuzz corpus cache
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: app/src/test/resources/corpus
          key: fuzz-corpus-${{ github.sha }}-${{ github.run_id }}

      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings
          path: |
            app/src/test/resources/corpus/
            **/crash-*
            **/oom-*
            **/timeout-*
          if-no-files-found: ignore

      - name: Upload fuzz test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: File issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --label ci-failure --state open \
            --search "in:title ${{ github.workflow }}" --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create \
              --title "Nightly failure: ${{ github.workflow }}" \
              --label "ci-failure,bug" \
              --body "Scheduled run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — check the uploaded artifacts (crash inputs / xcresult bundles) before they expire."
          fi
