site_name: Ukulele Companion
site_description: Offline app for learning ukulele on Android and iOS.
site_url: https://baijum.github.io/ukulele-companion/
repo_url: https://github.com/baijum/ukulele-companion
repo_name: baijum/ukulele-companion

theme:
  name: material
  logo: app-icon-512.png
  favicon: app-icon-512.png
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.expand
    - toc.integrate
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap
  - css/landing.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables

exclude_docs: |
  spec/**

nav:
  - Home: index.md
  - Manual:
      - Overview: manual/index.md
      - Android:
          - Getting Started: manual/android/01-getting-started.md
          - Explorer: manual/android/02-explorer.md
          - Chords: manual/android/03-chords.md
          - Patterns: manual/android/04-patterns.md
          - Progressions: manual/android/05-progressions.md
          - Favorites: manual/android/06-favorites.md
          - Songs: manual/android/07-songs.md
          - Settings: manual/android/08-settings.md
          - Learning and Practice: manual/android/09-learning.md
          - Play Along and Chord Training: manual/android/10-play-along.md
          - Tuner: manual/android/11-tuner.md
          - Pitch Monitor: manual/android/12-pitch-monitor.md
          - Metronome: manual/android/13-metronome.md
          - Melody Notepad: manual/android/14-melody-notepad.md
      - iOS:
          - Getting Started: manual/ios/01-getting-started.md
          - Explorer: manual/ios/02-explorer.md
          - Chords: manual/ios/03-chords.md
          - Patterns: manual/ios/04-patterns.md
          - Progressions: manual/ios/05-progressions.md
          - Favorites: manual/ios/06-favorites.md
          - Songs: manual/ios/07-songs.md
          - Settings: manual/ios/08-settings.md
          - Learning and Practice: manual/ios/09-learning.md
          - Play Along and Chord Training: manual/ios/10-play-along.md
          - Tuner: manual/ios/11-tuner.md
          - Pitch Monitor: manual/ios/12-pitch-monitor.md
          - Metronome: manual/ios/13-metronome.md
          - Melody Notepad: manual/ios/14-melody-notepad.md
  - Privacy Policy: privacy-policy.md
