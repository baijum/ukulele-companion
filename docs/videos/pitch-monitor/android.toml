[project]
title = "Pitch Monitor - Ukulele Companion"
description = "Real-time scrolling pitch visualization for checking intonation"
output = "../../feature-videos/android/pitch-monitor.mp4"
resolution = "1080x2424"

[branding]
intro = "../../jingle-intro.wav"
outro = "../../jingle-outro.wav"

[voiceover]
provider = "openai"
model = "tts-1-hd"
voice = "nova"
volume_boost = 3.0

[[scene]]
name = "overview"
video = "clips/android/01-overview.mp4"
audio = "audio/01-overview.mp3"
delay = 2.0
min_clip_duration = 20
recording_notes = """
Show the Pitch Monitor idle screen. Tap the canvas area gently to keep frames alive. Do NOT tap Start. Slowly scroll/swipe the screen area. Wait.
"""
narration = """
The Pitch Monitor gives you a real-time scrolling view of your \
pitch as you play. Think of it as a piano roll that draws your \
notes over time. It's perfect for checking intonation, practicing \
scales, and seeing how steady your pitch is across different \
fret positions.
"""

[[scene]]
name = "canvas-display"
video = "clips/android/02-canvas-display.mp4"
audio = "audio/02-canvas-display.mp3"
delay = 1.0
min_clip_duration = 24
recording_notes = """
Stay on Pitch Monitor, still idle. Tap canvas center (~540,1200) a few times to generate frame changes. Swipe slightly up/down on canvas area. Show the note labels on Y axis. Do NOT tap Start yet.
"""
narration = """
The main display is a dark scrolling canvas. The vertical axis \
shows note names from C three to C six, covering the full ukulele \
range. Gold horizontal lines mark natural notes, and red lines \
mark C notes for octave reference. As time passes, the canvas \
scrolls from right to left, showing about eight seconds of \
history at a time.
"""

[[scene]]
name = "pitch-trace"
video = "clips/android/03-pitch-trace.mp4"
audio = "audio/03-pitch-trace.mp3"
delay = 1.0
min_clip_duration = 25
recording_notes = """
Tap Start button (~540,2235) to begin listening. Wait 5s for trace to appear (emulator has no real audio, so trace may be minimal). Tap the canvas gently to keep frames alive. After ~18s, tap Stop (~540,2235). Wait.
"""
narration = """
When you tap Start and play a note, a blue trace line appears \
connecting the detected pitch points over time. This shows your \
pitch trajectory, so you can see if you're hitting notes cleanly \
or wobbling between positions. Amber glow bands show the \
chromagram energy, highlighting which pitch classes are ringing \
strongest at any moment.
"""

[[scene]]
name = "chord-detection-and-tips"
video = "clips/android/04-chord-detection-and-tips.mp4"
audio = "audio/04-chord-detection-and-tips.mp3"
delay = 1.0
min_clip_duration = 26
recording_notes = """
Tap Start (~540,2235). Wait for any chord detection display above canvas. Tap canvas area periodically to keep frames flowing. After ~20s, tap Stop. Wait. Do NOT open drawer.
"""
narration = """
As you play multiple notes, the Pitch Monitor collects them and \
identifies chords. The chord name appears prominently above the \
canvas. If notes are played one at a time rather than together, \
an arpeggio label appears. Use the Pitch Monitor alongside the \
Tuner to develop accurate fretting, or pair it with Scale Practice \
to check your melodic accuracy across the fretboard.
"""
