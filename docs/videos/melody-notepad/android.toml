[project]
title = "Melody Notepad - Ukulele Companion"
description = "Capture melodies by tapping the fretboard or recording from the microphone"
output = "../../feature-videos/android/melody-notepad.mp4"
resolution = "1080x2424"

[branding]
intro = "../../jingle-intro.wav"
outro = "../../jingle-outro.wav"

[voiceover]
provider = "openai"
model = "tts-1-hd"
voice = "nova"
volume_boost = 3.0

[[scene]]
name = "overview"
video = "clips/android/01-overview.mp4"
audio = "audio/01-overview.mp3"
delay = 2.0
min_clip_duration = 24
recording_notes = """
Navigate to Melody Notepad via drawer. Show the empty state. Tap the screen center to keep frames alive. Scroll slightly if content exists. Wait. Do NOT tap fretboard notes yet.
"""
narration = """
Melody Notepad lets you capture musical ideas quickly before \
they slip away. Enter notes by tapping the on-screen fretboard \
or by recording from your microphone. The app converts your \
input into a sequence of note names that you can save, play \
back, and revisit anytime. It's like a voice memo, but for \
melodies.
"""

[[scene]]
name = "tap-input"
video = "clips/android/02-tap-input.mp4"
audio = "audio/02-tap-input.mp3"
delay = 1.0
min_clip_duration = 25
recording_notes = """
Stay on Melody Notepad. Tap several fret positions on the bottom fretboard area to add notes. Wait 1-2s between taps. Each tap adds a note chip. Add 5-6 notes total. Wait. Do NOT navigate away.
"""
narration = """
In tap mode, the fretboard appears at the bottom of the screen. \
Tap any fret position and the corresponding note is added to \
your melody sequence. Each note appears as a chip showing its \
name and octave. You can hear each note as you tap it, so you \
can compose by ear directly on the virtual fretboard without \
needing your physical ukulele in hand.
"""

[[scene]]
name = "record-input"
video = "clips/android/03-record-input.mp4"
audio = "audio/03-record-input.mp3"
delay = 1.0
min_clip_duration = 26
recording_notes = """
Stay on Melody Notepad. Look for a record/microphone button (use uiautomator to find). Tap it to start recording mode. Wait 5s (emulator has no mic input, so minimal detection). Tap stop. Wait. If no record button is visible, just show the current state and tap screen.
"""
narration = """
Switch to record mode and tap the microphone button to start \
listening. Play notes on your real ukulele and the pitch \
detection engine identifies each note in real time, adding \
them to the sequence automatically. The confidence threshold \
filters out background noise, so only clearly played notes \
are captured. Tap stop when you've finished your phrase.
"""

[[scene]]
name = "save-and-load"
video = "clips/android/04-save-and-load.mp4"
audio = "audio/04-save-and-load.mp3"
delay = 1.0
min_clip_duration = 23
recording_notes = """
Stay on Melody Notepad with notes entered. Look for a save button (use uiautomator). Tap save. Wait 3s. Look for a load/list button. Tap it. Wait 3s. Tap a saved entry if one exists. Wait. Do NOT navigate away.
"""
narration = """
Once you've captured a melody, save it with a descriptive name. \
The melody list shows all your saved ideas with note counts and \
timestamps. Tap any saved melody to reload it for editing or \
playback. Melodies are stored locally and included in backup \
and restore, so they survive app updates and device changes.
"""

[[scene]]
name = "playback-and-tips"
video = "clips/android/05-playback-and-tips.mp4"
audio = "audio/05-playback-and-tips.mp3"
delay = 1.0
min_clip_duration = 25
recording_notes = """
Stay on Melody Notepad with notes entered. Look for a play button. Tap play to hear the melody. Wait 5s. Tap X on one note chip to delete it. Wait 2s. Tap play again. Wait. Do NOT navigate away or open drawer.
"""
narration = """
Hit the play button to hear your entire melody played back \
with ukulele samples. You can delete individual notes by \
tapping the X on any chip, or clear the whole sequence to \
start fresh. Use Melody Notepad alongside Scale Practice to \
check if your melody fits a particular scale, or pair it with \
Chord Progressions to build accompaniment for your tune.
"""
