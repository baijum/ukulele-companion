[project]
title = "Songbook - Ukulele Companion"
description = "Create, store, and transpose songs with ChordPro chord notation"
output = "../../feature-videos/android/songs.mp4"
resolution = "1080x2424"

[branding]
intro = "../../jingle-intro.wav"
outro = "../../jingle-outro.wav"

[voiceover]
provider = "openai"
model = "tts-1-hd"
voice = "nova"
volume_boost = 3.0

[[scene]]
name = "overview"
video = "clips/android/01-overview.mp4"
audio = "audio/01-overview.mp3"
delay = 2.0
min_clip_duration = 25
recording_notes = """
Navigate to Songs via drawer. Show the song list with search bar and sort \
button visible at the top. If songs exist with labels, show the label filter \
chips below the search bar. Scroll down to show song cards with label chips. \
Scroll back up. Wait. Do NOT tap the + button yet.
"""
narration = """
The Songbook is your personal collection of songs with ChordPro \
notation. Search by title, artist, or content, sort by date or \
name, and use labels to organize songs by genre or occasion. \
Chord names appear on a separate line above the lyrics, \
perfectly aligned with each word. Everything is stored offline \
so your songs are always available, whether you're at a jam \
session or practicing at home.
"""

[[scene]]
name = "creating-a-song"
video = "clips/android/02-creating-a-song.mp4"
audio = "audio/02-creating-a-song.mp3"
delay = 1.0
min_clip_duration = 23

recording_notes = """
On Songs screen, tap the + FAB button (~964,2245). A new song editor opens. \
Tap the title field and type a short title via `adb shell input text`. Wait 2s. \
Tap the artist field and type an artist name. Wait 2s. Scroll down to show the \
strum pattern picker and label editor. Wait 2s. Scroll further to show the \
chord insertion chips (C, G, Am, F...) above the text area. Wait. Do NOT press \
back or navigate away.
"""
narration = """
Tap the plus button to start a new song. Give it a title and \
optionally set the artist. Pick a strum pattern to associate \
with the song and add labels to keep your collection organized. \
Below the text area, quick-insert chips let you tap common \
chords to drop them into your lyrics without typing brackets \
manually.
"""

[[scene]]
name = "chords-above-lyrics"
video = "clips/android/03-chords-above-lyrics.mp4"
audio = "audio/03-chords-above-lyrics.mp3"
delay = 1.0
min_clip_duration = 28
recording_notes = """
Stay in the song editor. Tap the text area. Type a sample line with chords \
like "[C]Amazing [F]Grace [C]how [G]sweet". Wait 3s. Tap the Preview tab to \
switch to live preview -- chords appear on a separate line above the lyrics, \
aligned with each word. Wait 3s. Tap the Edit tab to switch back. Wait 2s. \
Scroll down slightly to show more content. Wait. Do NOT navigate away. \
Do NOT press back.
"""
narration = """
To add chords, use standard ChordPro bracket notation or tap \
the quick-insert chips. Toggle between Edit and Preview to see \
how your chords render in real time. The preview shows each \
chord on its own line directly above the word it belongs to, \
perfectly aligned just like a professional lead sheet. Tap any \
chord name in the viewer to see its voicing diagram.
"""

[[scene]]
name = "transpose-and-key"
video = "clips/android/04-transpose-and-key.mp4"
audio = "audio/04-transpose-and-key.mp3"
delay = 1.0
min_clip_duration = 25
recording_notes = """
Stay in song editor/viewer. Look for transpose controls (find via uiautomator). Tap transpose up a few times. Wait 3s. Tap transpose down. Wait 3s. Look for key detection button and tap it. Wait until clip ends.
"""
narration = """
Need the song in a different key? The transpose controls let \
you shift all chords up or down by any number of semitones with \
one tap. The key detection feature analyzes the chords in your \
song and suggests the likely musical key. This is helpful when \
you're transcribing a song by ear and want to confirm the key \
before sharing your chart.
"""

[[scene]]
name = "chordpro-and-management"
video = "clips/android/05-chordpro-and-management.mp4"
audio = "audio/05-chordpro-and-management.mp3"
delay = 1.0
min_clip_duration = 27

recording_notes = """
Navigate to Songs via drawer (do NOT press back -- it may exit the app).
Show the song list with saved songs visible.
1. Tap the search bar and type a short query -- wait 3s
2. Clear the search -- wait 2s
3. Tap a song card to open it -- wait 3s
4. Show the strum pattern and labels in the viewer -- wait 3s
5. Tap the back arrow to return to the list -- wait 3s
6. Wait until clip ends
Do NOT press back (may leave the app entirely).
Do NOT open the drawer.
"""
narration = """
The Songbook supports ChordPro format, a widely used standard \
for chord charts. Import existing ChordPro files or export your \
songs to share with others. The song list shows all your entries \
with titles, artists, and label chips at a glance. Tap any song \
to open it, then use the toolbar to edit, delete, or share. \
Combine the Songbook with Chord Progressions to build a complete \
practice and performance toolkit.
"""
