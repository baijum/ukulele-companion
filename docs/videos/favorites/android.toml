[project]
title = "Favorites - Ukulele Companion"
description = "Save, organize, and quickly recall your go-to chord voicings"
output = "../../feature-videos/android/favorites.mp4"
resolution = "1080x2424"

[branding]
intro = "../../jingle-intro.wav"
outro = "../../jingle-outro.wav"

[voiceover]
provider = "openai"
model = "tts-1-hd"
voice = "nova"
volume_boost = 3.0

[[scene]]
name = "overview"
video = "clips/android/01-overview.mp4"
audio = "audio/01-overview.mp3"
delay = 2.0
min_clip_duration = 23
recording_notes = """
Navigate to Favorites via drawer. Show the Favorites screen (may have saved voicings or be empty). Tap the screen center gently to keep frames alive. Scroll if there are cards. Wait. Do NOT navigate away.
"""
narration = """
Favorites is where you keep your go-to chord voicings for \
instant access. Instead of searching the full Chord Library \
every time, save the shapes you use most and find them in one \
tap. It's especially handy when you're learning a new song and \
want to bookmark the exact voicings that work best together.
"""

[[scene]]
name = "saving-voicings"
video = "clips/android/02-saving-voicings.mp4"
audio = "audio/02-saving-voicings.mp3"
delay = 1.0
min_clip_duration = 24
recording_notes = """
Navigate to Chords via drawer. Show C Major voicing grid. Tap heart on first card (~79,1405) -- wait 2s. Tap heart on second card (~593,1405) -- wait 2s. Change root to D (~384,438) -- tap heart on a card -- wait 2s. Change back to C (~95,438). Wait. Do NOT tap the share button (launches intent picker that leaves the app).
"""
narration = """
To save a voicing, open the Chord Library, find a shape you \
like, and tap the heart icon on the card. A filled heart means \
it's saved. You can also save voicings directly from the \
Explorer when the chord detector identifies what you're playing. \
Every saved voicing keeps its diagram, fret positions, and \
note information intact.
"""

[[scene]]
name = "browsing-and-playback"
video = "clips/android/03-browsing-and-playback.mp4"
audio = "audio/03-browsing-and-playback.mp3"
delay = 1.0
min_clip_duration = 25
recording_notes = """
Navigate to Favorites via drawer. Show saved voicings grid. Tap a card to play it -- wait 3s. Tap another card -- wait 3s. Scroll if enough cards. Tap another card. Wait. Do NOT navigate away.
"""
narration = """
Open the Favorites screen to see all your saved voicings in a \
scrollable grid. Each card shows the chord name and diagram at \
a glance. Tap any card to hear the chord played back, just like \
in the Chord Library. This makes Favorites a quick way to \
audition several voicings when building a chord progression or \
choosing substitutions for a song.
"""

[[scene]]
name = "managing-favorites"
video = "clips/android/04-managing-favorites.mp4"
audio = "audio/04-managing-favorites.mp3"
delay = 1.0
min_clip_duration = 26
recording_notes = """
Stay on Favorites screen. Tap a card to play -- wait 2s. Scroll slightly -- wait 2s. Tap another card -- wait 2s. Scroll back. Tap the screen center periodically to keep frames flowing. Wait until clip ends. Do NOT open drawer.
"""
narration = """
To remove a voicing, tap the heart icon again and it returns to \
unfilled, clearing it from the list. Your favorites are stored \
locally on the device and persist across app restarts. They're \
also included in the backup and restore feature, so you won't \
lose them if you switch phones. Pair Favorites with the Songbook \
to create a personalized chord sheet workflow.
"""
