[project]
title = "Strumming Patterns - Ukulele Companion"
description = "Learn and practice strumming and fingerpicking patterns with animated playback"
output = "../../feature-videos/android/patterns.mp4"
resolution = "1080x2424"

[branding]
intro = "../../jingle-intro.wav"
outro = "../../jingle-outro.wav"

[voiceover]
provider = "openai"
model = "tts-1-hd"
voice = "nova"
volume_boost = 3.0

[[scene]]
name = "overview"
video = "clips/android/01-overview.mp4"
audio = "audio/01-overview.mp3"
delay = 2.0
min_clip_duration = 24
recording_notes = """
Navigate to Patterns via drawer. Show the default Strumming tab with pattern list. Scroll down to show more patterns (swipe Y 1500->800). Scroll back up. Wait. Do NOT tap any pattern yet.
"""
narration = """
Strumming Patterns is your guide to ukulele rhythm techniques. \
It includes a curated collection of strumming and fingerpicking \
patterns that cover everything from basic down-up strums to \
syncopated island-style rhythms. Each pattern is displayed as \
an animated notation so you can see and hear exactly how to \
play it.
"""

[[scene]]
name = "pattern-list"
video = "clips/android/02-pattern-list.mp4"
audio = "audio/02-pattern-list.mp3"
delay = 1.0
min_clip_duration = 24
recording_notes = """
Stay on Patterns, Strumming tab. Scroll down slowly through the list (swipe Y 1500->900). Wait 3s. Scroll more. Wait 3s. Scroll back to top. Wait. Do NOT leave the screen.
"""
narration = """
The main screen shows a scrollable list of pattern cards organized \
by difficulty and style. Each card shows the pattern name, time \
signature, difficulty badge, visual beat arrows, notation, \
description, genre tags, and a BPM slider — all visible at a \
glance. Patterns range from simple quarter-note downstrokes to \
complex calypso and reggae rhythms.
"""

[[scene]]
name = "pattern-detail"
video = "clips/android/03-pattern-detail.mp4"
audio = "audio/03-pattern-detail.mp3"
delay = 1.0
min_clip_duration = 24
recording_notes = """
Scroll to show a pattern card with beat arrows clearly visible. Wait 3s. Tap the FAB (+) to open the create pattern sheet. Wait 3s. Show the time signature chips and beat count +/− controls. Tap a different time signature chip to show beats auto-resizing. Wait 3s. Dismiss the sheet. Wait.
"""
narration = """
Each card displays the pattern as a row of arrows and symbols. \
Down arrows represent downstrokes, up arrows are upstrokes, \
and crosses mark chucks or muted strums. Tap the plus button \
to create your own pattern. Choose a time signature and the \
beat count adjusts automatically. Use the plus-minus controls \
to fine-tune the number of beats from two to sixteen.
"""

[[scene]]
name = "fingerpicking"
video = "clips/android/04-fingerpicking.mp4"
audio = "audio/04-fingerpicking.mp3"
delay = 1.0
min_clip_duration = 26
recording_notes = """
Press back to return to pattern list. Look for a Fingerpicking tab (use uiautomator). Tap it. Wait 3s. Scroll through fingerpicking patterns. Wait 3s. Tap one to see details. Wait 3s. Press back. Wait.
"""
narration = """
Fingerpicking patterns use a different notation showing which \
string to pluck on each beat. The thumb handles the fourth and \
third strings while the index, middle, and ring fingers cover \
the upper strings. Patterns like Travis picking and arpeggios \
are included, each with string-by-string breakdowns that make \
complex fingerstyle techniques approachable for beginners.
"""

[[scene]]
name = "playback-and-practice"
video = "clips/android/05-playback-and-practice.mp4"
audio = "audio/05-playback-and-practice.mp3"
delay = 1.0
min_clip_duration = 26
recording_notes = """
Scroll to a pattern card. Tap the play button on the card. Let it run 5-8s showing beat highlights. Drag the BPM slider to change tempo. Tap play again at the new tempo. Let it run a few seconds. Tap stop. Wait. Do NOT open drawer.
"""
narration = """
Tap the play button on any card to hear the pattern with \
ukulele samples at the current tempo. The beat arrows highlight \
in sequence as the pattern plays, so you can follow along \
visually. Drag the BPM slider to start slow and gradually \
build up to full tempo. Combine Strumming Patterns with the \
Metronome and Chord Progressions for a structured rhythm \
practice session.
"""
