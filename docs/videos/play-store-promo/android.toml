[project]
title = "Ukulele Companion - Play Store Promo"
description = "90-second promotional video showcasing the app's best features for Google Play Store"
output = "../../feature-videos/android/play-store-promo.mp4"
resolution = "1080x2424"
canvas = "1920x1080"
canvas_color = "#F5F0E8"

[branding]
intro = "../../jingle-intro.wav"
outro = "../../jingle-outro.wav"

[voiceover]
provider = "openai"
model = "tts-1-hd"
voice = "nova"
volume_boost = 3.0

# ═══════════════════════════════════════════════════════════════
# ACT 1 — HOOK (first 30 seconds, critical for Play Store autoplay)
# ═══════════════════════════════════════════════════════════════

# ── Scene 1: Explorer — Chord Detection ──────────────────────
[[scene]]
name = "explorer-chord"
video = "clips/android/01-explorer-chord.mp4"
audio = "audio/01-explorer-chord.mp3"
delay = 2.0
min_clip_duration = 18
recording_notes = """
Navigate to Explorer via drawer. The fretboard should be empty.
1. Tap open G (~169,877) -- wait 0.5s
2. Tap open C (~169,751) -- wait 0.5s
3. Tap open E (~169,625) -- wait 0.5s
4. Tap fret 3 on A string (~547,499) -- wait 2s (chord detects as C Major)
5. Tap the play button to hear the chord -- wait 3s
6. Scroll down slightly to show chord info -- wait 3s
7. Wait until clip ends
Do NOT open the drawer or navigate away.
"""
narration = """
Tap the fretboard and instantly know what chord you're playing. \
Ukulele Companion detects twenty chord types across every root \
note, shows you intervals, fingering, and difficulty, and plays \
it back with real ukulele samples.
"""

# ── Scene 2: Chord Library ───────────────────────────────────
[[scene]]
name = "chord-library"
video = "clips/android/02-chord-library.mp4"
audio = "audio/02-chord-library.mp3"
delay = 1.0
min_clip_duration = 13
recording_notes = """
Navigate to Chords via drawer. Show default state (C Major, Triad).
1. Tap root note D -- wait 1s
2. Tap root note E -- wait 1s
3. Tap back to C -- wait 1s
4. Tap category "Seventh" -- wait 1s
5. Tap back to "Triad" -- wait 1s
6. Tap a voicing card to play it -- wait 2s
7. Tap another card -- wait 2s
8. Wait until clip ends
Do NOT tap the share button. Do NOT open the drawer.
"""
narration = """
Hundreds of chord voicings at your fingertips. Browse by root \
note and type, tap any card to hear it, and filter by inversion \
for smoother voice leading.
"""

# ── Scene 3: Tuner ───────────────────────────────────────────
[[scene]]
name = "tuner"
video = "clips/android/03-tuner.mp4"
audio = "audio/03-tuner.mp3"
delay = 1.0
min_clip_duration = 14
recording_notes = """
Navigate to Tuner via drawer. Show idle tuner with SwiftF0 badge.
1. Tap Start -- wait 2s
2. Tap G string button to play reference pitch -- wait 2s
3. Tap C string button -- wait 2s
4. Wait 2s for frozen needle to appear
5. Tap Stop -- wait 2s
6. Wait until clip ends
Do NOT navigate away.
"""
narration = """
A chromatic tuner with neural pitch detection. The meter shows \
your pitch in real time, and the needle freezes to show your \
last settled note so you always know where you landed.
"""

# ═══════════════════════════════════════════════════════════════
# ACT 2 — PRACTICE TOOLS (30–60 seconds)
# ═══════════════════════════════════════════════════════════════

# ── Scene 4: Metronome ───────────────────────────────────────
[[scene]]
name = "metronome"
video = "clips/android/04-metronome.mp4"
audio = "audio/04-metronome.mp3"
delay = 1.0
min_clip_duration = 13
recording_notes = """
Navigate to Metronome via drawer.
1. Tap 6/8 time signature chip -- wait 2s (shows compound meter with 2 beat circles)
2. Tap 4/4 -- wait 1s
3. Tap beat 2 to toggle accent -- wait 1s
4. Tap play -- let it run 3s with indicators pulsing
5. Tap stop -- wait 2s
6. Wait until clip ends
Do NOT open the drawer.
"""
narration = """
A built-in metronome with simple and compound time signatures, \
tap tempo, customizable accent patterns, and subdivisions. \
Everything you need to build rock-solid rhythm.
"""

# ── Scene 5: Strumming Patterns ──────────────────────────────
[[scene]]
name = "strumming-patterns"
video = "clips/android/05-strumming-patterns.mp4"
audio = "audio/05-strumming-patterns.mp3"
delay = 1.0
min_clip_duration = 12
recording_notes = """
Navigate to Patterns via drawer.
1. Show the strumming pattern list with cards -- wait 2s
2. Tap play on the Island Strum card -- wait 3s showing beat highlights
3. Tap stop -- wait 1s
4. Tap Fingerpicking tab -- wait 2s
5. Wait until clip ends
Do NOT open the drawer.
"""
narration = """
Learn strumming and fingerpicking patterns with animated notation. \
See exactly when to strum down, up, or mute, and hear each \
pattern played at any tempo. Create your own patterns with \
adjustable beat counts and time signatures.
"""

# ── Scene 6: Chord Progressions ──────────────────────────────
[[scene]]
name = "chord-progressions"
video = "clips/android/06-chord-progressions.mp4"
audio = "audio/06-chord-progressions.mp3"
delay = 1.0
min_clip_duration = 14
recording_notes = """
Navigate to Progressions via drawer.
1. Show Major mode, key of C -- wait 1s
2. Scroll to show a card with harmonic function labels (Tonic, Subdominant, Dominant) on chord chips -- wait 2s
3. Tap play on the card to hear the progression -- wait 3s
4. Tap Practice button -- let practice mode run 4s
5. Wait until clip ends
Do NOT press back (may exit the app). Do NOT open the drawer.
"""
narration = """
Practice the most popular chord progressions in any key. Each \
chord is labeled with its harmonic function so you can see the \
musical structure. Enter practice mode and the chords advance \
automatically on the beat, so you can focus on smooth transitions.
"""

# ═══════════════════════════════════════════════════════════════
# ACT 3 — CREATION AND CLOSING (60–90 seconds)
# ═══════════════════════════════════════════════════════════════

# ── Scene 7: Songbook ────────────────────────────────────────
[[scene]]
name = "songbook"
video = "clips/android/07-songbook.mp4"
audio = "audio/07-songbook.mp3"
delay = 1.0
min_clip_duration = 13
recording_notes = """
Navigate to Songs via drawer. Show the song list with search bar and label chips.
1. Tap a song to open it -- wait 2s
2. Show the viewer with strum pattern, labels, and chords above lyrics -- wait 3s
3. Tap transpose up twice -- wait 2s
4. Tap the Edit/Preview toggle if visible -- wait 2s
5. Wait until clip ends
Do NOT press back. Do NOT open the drawer.
"""
narration = """
Create lead sheets with ChordPro notation. Organize your songs \
with labels, attach strum patterns, and search by title or \
artist. Chords appear on their own line above the lyrics, \
perfectly aligned. Transpose any song to a new key with one tap.
"""

# ── Scene 8: Scale Overlay ───────────────────────────────────
[[scene]]
name = "scale-overlay"
video = "clips/android/08-scale-overlay.mp4"
audio = "audio/08-scale-overlay.mp3"
delay = 1.0
min_clip_duration = 14
recording_notes = """
Navigate to Explorer via drawer. Tap Reset if notes are selected.
1. Tap Scales button -- wait 1s
2. Select Major scale -- wait 2s (fretboard lights up with scale notes)
3. Tap Position 1 (0-4) chip -- wait 2s
4. Tap All position chip -- wait 2s
5. Tap Natural Minor -- wait 2s (colors change)
6. Wait until clip ends
Do NOT open the drawer.
"""
narration = """
Explore thirty-eight scales with a color-coded fretboard overlay. \
Filter by position, see which chords fit the key, and master \
the entire neck one section at a time.
"""

# ── Scene 9: Closing ─────────────────────────────────────────
[[scene]]
name = "closing"
video = "clips/android/09-closing.mp4"
audio = "audio/09-closing.mp3"
delay = 1.0
min_clip_duration = 15
recording_notes = """
Navigate to Explorer via drawer. Tap Reset. Show the clean Explorer
screen with beginner chord suggestions and Did You Know section.
1. Tap Next Tip once -- wait 3s
2. Scroll down and back up slowly -- wait 3s
3. Wait until clip ends
Do NOT open the drawer. This is the final scene.
"""
narration = """
Completely free. Completely offline. No ads, no tracking. \
Fully accessible with TalkBack for blind and visually impaired \
musicians. Download Ukulele Companion and start playing today.
"""
